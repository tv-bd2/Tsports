<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamPro - Ultimate IPTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #1a1a2e, #0f0f0f);
      color: #fff;
    }

    /* প্রিমিয়াম গ্লাস ইফেক্ট */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-5px);
      border-color: #22c55e;
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
    }

    /* ব্যানার অ্যানিমেশন */
    #rotatingBanner {
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* বটম নেভিগেশন */
    footer {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px 25px 0 0;
    }

    .active-tab {
      color: #22c55e;
      position: relative;
    }

    .active-tab::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    .section-title {
      position: relative;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .section-title::before {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 40%;
      height: 3px;
      background: #22c55e;
      border-radius: 2px;
    }

    /* চ্যানেল সার্কেল হভার */
    .channel-circle {
      transition: 0.3s;
      border: 2px solid transparent;
    }

    .channel-circle:hover {
      border-color: #22c55e;
      transform: rotate(5deg) scale(1.1);
    }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="pb-24">

  <header class="p-5 flex justify-between items-center">
    <h1 class="text-2xl font-extrabold tracking-tighter">STREAM<span class="text-green-500">PRO</span></h1>
    <div class="bg-gray-800 p-2 rounded-full px-4 text-sm font-medium border border-gray-700">
      <i class="fa-solid fa-circle text-red-600 text-[8px] mr-2 animate-pulse"></i> LIVE
    </div>
  </header>

  <main class="px-4">
    
    <div id="liveSection" class="space-y-8">
      <div class="relative group overflow-hidden rounded-2xl">
        <a href="tsports.html">
          <img id="rotatingBanner" src="https://i.postimg.cc/2SMFyVNZ/1752918661-OTT-live-1920.jpg" class="w-full h-48 md:h-80 object-cover rounded-2xl transition duration-1000" />
          <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
          <div class="absolute bottom-4 left-4">
            <span class="bg-green-600 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">TRENDING</span>
            <h2 class="text-xl font-bold">Watch Live Sports Now</h2>
          </div>
        </a>
      </div>
      
      <section>
        <h3 class="section-title text-lg font-bold">Live Events</h3>
        <div class="flex gap-4 overflow-x-auto pb-4">
          <a href="tsports.html" class="flex-shrink-0 group">
            <img src="https://i.postimg.cc/2SMFyVNZ/1752918661-OTT-live-1920.jpg" class="w-20 h-20 rounded-full object-cover border-2 border-gray-700 group-hover:border-green-500 transition shadow-lg" />
          </a>
          <a href="stars1.html" class="flex-shrink-0 group">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWAKForKJQ3yomsGI4xpQoCqCLRFGl2psGJXtbr9_bRIcRM0Mwn0idJK17&s=10" class="w-20 h-20 rounded-full object-cover border-2 border-gray-700 group-hover:border-green-500 transition" />
          </a>
          </div>
      </section>
      
      <section>
        <h3 class="section-title text-lg font-bold">Sports Channels</h3>
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-4">
          <a href="tsports.html" class="channel-circle"><img src="tsports.jpg" class="w-full rounded-full shadow-xl" /></a>
          <a href="stars1.html" class="channel-circle"><img src="stars1.jpg" class="w-full rounded-full shadow-xl" /></a>
          <a href="willow.html" class="channel-circle"><img src="willow.jpg" class="w-full rounded-full shadow-xl" /></a>
          <a href="wwe.html" class="channel-circle"><img src="wwe.jpg" class="w-full rounded-full shadow-xl" /></a>
          <a href="tencricket.html" class="channel-circle"><img src="tencricket.jpg" class="w-full rounded-full shadow-xl" /></a>
          <a href="fancode.html" class="channel-circle"><img src="fancode.jpg" class="w-full rounded-full shadow-xl" /></a>
        </div>
      </section>
    </div>
    
    <div id="moviesSection" class="grid grid-cols-2 md:grid-cols-4 gap-6 hidden">
      <a href="taandob.html" class="glass-card p-2 rounded-xl block">
        <img src="taandob.jpg" class="w-full rounded-lg h-60 object-cover" />
        <div class="mt-3 px-1">
          <p class="font-bold text-sm truncate">Taandob</p>
          <p class="text-[10px] text-green-500 uppercase font-bold mt-1">2025 • Action</p>
        </div>
      </a>
      <a href="jongli.html" class="glass-card p-2 rounded-xl block">
        <img src="jongli.jpg" class="w-full rounded-lg h-60 object-cover" />
        <div class="mt-3 px-1">
          <p class="font-bold text-sm truncate">Jongli</p>
          <p class="text-[10px] text-green-500 uppercase font-bold mt-1">2025 • Chorki</p>
        </div>
      </a>
      </div>
    
    <div id="tvSection" class="grid grid-cols-3 sm:grid-cols-5 gap-6 hidden">
      <a href="btv.html" class="channel-circle"><img src="btv.jpg" class="w-full rounded-full shadow-2xl border border-gray-800" /></a>
      <a href="atnbangla.html" class="channel-circle"><img src="atnbangla.jpg" class="w-full rounded-full shadow-2xl border border-gray-800" /></a>
      <a href="somoy.html" class="channel-circle"><img src="somoy.jpg" class="w-full rounded-full shadow-2xl border border-gray-800" /></a>
      </div>

  </main>
  
  <footer class="fixed bottom-0 left-0 right-0 p-4 z-50">
    <div class="flex justify-around items-center max-w-md mx-auto">
      <button id="liveBtn" class="flex flex-col items-center transition active-tab">
        <i class="fa-solid fa-house-chimney text-xl"></i>
        <span class="text-[10px] mt-1 font-bold">Home</span>
      </button>
      <button id="moviesBtn" class="flex flex-col items-center text-gray-400 transition">
        <i class="fa-solid fa-clapperboard text-xl"></i>
        <span class="text-[10px] mt-1 font-bold">Movies</span>
      </button>
      <button id="tvBtn" class="flex flex-col items-center text-gray-400 transition">
        <i class="fa-solid fa-tv text-xl"></i>
        <span class="text-[10px] mt-1 font-bold">Live TV</span>
      </button>
    </div>
  </footer>
  
  <script>
    const btns = { live: document.getElementById('liveBtn'), movies: document.getElementById('moviesBtn'), tv: document.getElementById('tvBtn') };
    const secs = { live: document.getElementById('liveSection'), movies: document.getElementById('moviesSection'), tv: document.getElementById('tvSection') };
    
    function showTab(type) {
      Object.keys(secs).forEach(k => {
        secs[k].classList.toggle('hidden', k !== type);
        btns[k].classList.toggle('active-tab', k === type);
        btns[k].classList.toggle('text-gray-400', k !== type);
      });
      localStorage.setItem('activeTab', type);
    }
    
    btns.live.onclick = () => showTab('live');
    btns.movies.onclick = () => showTab('movies');
    btns.tv.onclick = () => showTab('tv');
    
    // Auto-load last tab
    const lastTab = localStorage.getItem('activeTab') || 'live';
    showTab(lastTab);

    // Banner Rotation with Fade
    const banners = [
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxzU52peJjJZ0vh8k5DeB7RJI7pS978HpxqZjCLgu-KiK2OK0_yeZ4Ues&s=10",
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCgjHleumVQyo5CA5xLyUoO9T1-3WHafaX5Q&usqp=CAU",
      "https://i.postimg.cc/2SMFyVNZ/1752918661-OTT-live-1920.jpg"
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % banners.length;
      const b = document.getElementById('rotatingBanner');
      b.style.opacity = 0.5;
      setTimeout(() => {
        b.src = banners[idx];
        b.style.opacity = 1;
      }, 300);
    }, 4000);
  </script>
</body>
</html>
